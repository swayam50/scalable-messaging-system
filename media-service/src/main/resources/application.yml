server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: media-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/messaging}
    username: ${DB_USERNAME:messaging}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Shares the database with auth-service: keep a separate history table, and baseline
    # because the schema already contains auth-service's tables.
    table: flyway_media_history
    baseline-on-migrate: true
    baseline-version: 0

media:
  storage:
    internal-endpoint: ${MINIO_INTERNAL_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin-secret}
    bucket: ${MINIO_BUCKET:chat-media}
  upload-url-ttl: 10m
  download-url-ttl: 10m
  signing-secret: ${MEDIA_SIGNING_SECRET:local-dev-media-signing-secret-change-me}
  chat-api-urls: ${CHAT_API_URLS:http://localhost:8082}
  auth:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    public-key: ${AUTH_PUBLIC_KEY:}
    issuer: ${AUTH_ISSUER:http://localhost:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
