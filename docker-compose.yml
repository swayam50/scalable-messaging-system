# Local environment for the messaging system.
#
#   docker compose up -d                 -> infrastructure only (run services from your IDE)
#   docker compose --profile app up -d   -> infrastructure + application containers (added in later milestones)
#
# Credentials come from .env (copy .env.example).

name: messaging-system

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messaging}
      POSTGRES_USER: ${POSTGRES_USER:-messaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scylla:
    image: scylladb/scylla:2026.3.2
    # 1 CPU shard + 1 GB RAM keeps ScyllaDB laptop-friendly; developer-mode skips production checks
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------- application services (profile: app) ----------
  auth-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-messaging}
      DB_USERNAME: ${POSTGRES_USER:-messaging}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      JWT_ISSUER: http://auth-service:8081
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  chat-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      CHAT_WORKER_ID: "1"                       # Snowflake worker id: unique per chat node
      SCYLLA_CONTACT_POINTS: scylla:9042
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_ISSUER: http://auth-service:8081     # must match auth-service's JWT_ISSUER
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8082:8082"
    depends_on:
      scylla:
        condition: service_healthy
      auth-service:
        condition: service_started

  messaging-ui:
    profiles: ["app"]
    build:
      context: .
      dockerfile: messaging-ui/Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081      # server-to-server (inside the compose network)
      CHAT_API_URL: http://localhost:8082             # used by the browser
      CHAT_WS_URL: ws://localhost:8082/ws/chat        # used by the browser
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started

volumes:
  postgres-data:
  scylla-data:
