# Local environment for the messaging system.
#
#   docker compose up -d                 -> infrastructure only (run services from your IDE)
#   docker compose --profile app up -d   -> infrastructure + application containers (added in later milestones)
#
# Credentials come from .env (copy .env.example).

name: messaging-system

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messaging}
      POSTGRES_USER: ${POSTGRES_USER:-messaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scylla:
    image: scylladb/scylla:2026.3.2
    # 1 CPU shard + 1 GB RAM keeps ScyllaDB laptop-friendly; developer-mode skips production checks
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # S3-compatible object storage for media: SeaweedFS (Apache-2.0) with its S3 gateway.
  # Credentials come from the s3-identities config below.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API (browsers upload/download here with presigned requests)
    volumes:
      - seaweedfs-data:/data

  # ---------- application services (profile: app) ----------
  auth-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-messaging}
      DB_USERNAME: ${POSTGRES_USER:-messaging}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      JWT_ISSUER: http://auth-service:8081
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # Three chat nodes forming one consistent-hash ring. Each needs a unique node id,
  # Snowflake worker id, and the addresses peers (gRPC) and browsers (WebSocket) use to reach it.
  chat-service-1: &chat-node
    profiles: ["app"]
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    image: messaging-system-chat-service
    environment: &chat-env
      CHAT_NODE_ID: chat-1
      CHAT_WORKER_ID: "1"
      CHAT_GRPC_ADDRESS: chat-service-1:9090
      CHAT_WS_URL: ws://localhost:8082/ws/chat
      CHAT_CLUSTER_SECRET: ${CHAT_CLUSTER_SECRET:-local-dev-cluster-secret}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-local-dev-media-signing-secret-change-me}
      SCYLLA_CONTACT_POINTS: scylla:9042
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_ISSUER: http://auth-service:8081     # must match auth-service's JWT_ISSUER
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8082:8082"
    depends_on:
      scylla:
        condition: service_healthy
      auth-service:
        condition: service_started

  chat-service-2:
    <<: *chat-node
    build: !reset null
    environment:
      <<: *chat-env
      CHAT_NODE_ID: chat-2
      CHAT_WORKER_ID: "2"
      CHAT_GRPC_ADDRESS: chat-service-2:9090
      CHAT_WS_URL: ws://localhost:8083/ws/chat
    ports:
      - "8083:8082"

  chat-service-3:
    <<: *chat-node
    build: !reset null
    environment:
      <<: *chat-env
      CHAT_NODE_ID: chat-3
      CHAT_WORKER_ID: "3"
      CHAT_GRPC_ADDRESS: chat-service-3:9090
      CHAT_WS_URL: ws://localhost:8084/ws/chat
    ports:
      - "8084:8082"

  media-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: media-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-messaging}
      DB_USERNAME: ${POSTGRES_USER:-messaging}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      STORAGE_INTERNAL_ENDPOINT: http://seaweedfs:8333   # container -> S3 store
      STORAGE_PUBLIC_ENDPOINT: http://localhost:8333     # browser -> S3 store (presigned URLs are signed for this host)
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-media-access-key}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-media-secret-key-change-me}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-local-dev-media-signing-secret-change-me}
      CHAT_API_URLS: http://chat-service-1:8082,http://chat-service-2:8082,http://chat-service-3:8082
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_ISSUER: http://auth-service:8081
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  messaging-ui:
    profiles: ["app"]
    build:
      context: .
      dockerfile: messaging-ui/Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081      # server-to-server (inside the compose network)
      CHAT_API_URLS: http://localhost:8082,http://localhost:8083,http://localhost:8084   # browser-facing; client fails over
      MEDIA_API_URL: http://localhost:8085
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started

configs:
  # S3 identity for media-service (inline config; values come from .env)
  s3-identities:
    content: |
      {"identities": [{"name": "media-service",
        "credentials": [{"accessKey": "${STORAGE_ACCESS_KEY:-media-access-key}", "secretKey": "${STORAGE_SECRET_KEY:-media-secret-key-change-me}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  seaweedfs-data:
  postgres-data:
  scylla-data:
