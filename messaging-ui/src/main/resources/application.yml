server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 7d                  # matches the refresh-token lifetime
      tracking-modes: cookie       # never put the session id in URLs (;jsessionid=...), where it can leak
      cookie:
        http-only: true            # JavaScript cannot read the session cookie
        same-site: lax             # not sent on cross-site POSTs (basic CSRF protection)

spring:
  application:
    name: messaging-ui
  mustache:
    servlet:
      expose-request-attributes: false

ui:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  chat-api-url: ${CHAT_API_URL:http://localhost:8082}
  chat-ws-url: ${CHAT_WS_URL:ws://localhost:8082/ws/chat}

management:
  endpoints:
    web:
      exposure:
        include: health
